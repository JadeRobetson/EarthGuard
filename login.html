
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Welcome Back!</h2>

        <form onsubmit="event.preventDefault(); alert('Connect an authentication service to log in securely.');">
            <input type="email" placeholder="Email address" required>

            <input type="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p style="text-align:center;">
            Don't have an account? Sign up
        </p>
    </div>

</body>
</html>
